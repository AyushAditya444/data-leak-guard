[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard"
version = "0.1.0"
description = "Drop-in OpenAI-compatible proxy that stops Indian personal data and secrets from leaking into LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "openai>=1.30",
    "ruff>=0.5",
]
# Only for `python -m leakguard.ner.export` (never needed to run the guard). Bounded to the
# versions the export was verified with: exporter behaviour changes between majors.
export = [
    "torch>=2.14,<3",
    "transformers>=5.20,<6",
    "onnx>=1.23",
    "onnxscript>=0.7",
    "sentencepiece>=0.2",
    "protobuf>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leakguard = ["data/*.txt", "data/*.gz", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
