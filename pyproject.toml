[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard"
version = "0.1.0"
description = "Drop-in OpenAI-compatible proxy that stops Indian personal data and secrets from leaking into LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "openai>=1.30",
    "ruff>=0.5",
]
# Only for `python -m leakguard.ner.export` (never needed to run the guard). Bounded to the
# versions the export was verified with: exporter behaviour changes between majors.
export = [
    "torch>=2.14,<3",
    "transformers>=5.20,<6",
    "onnx>=1.23",
    "onnxscript>=0.7",
    "sentencepiece>=0.2",
    "protobuf>=4",
]
# Only for the Presidio baseline (`python -m leakguard.evaluation presidio-run`). Pinned so
# the comparison can be reproduced. preshed 3.0.14 crashes loading spaCy models on Windows
# ("OverflowError ... C ssize_t"), so 3.0.13 is pinned too.
baseline = [
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
    "spacy==3.8.16",
    "preshed==3.0.13",
    "en_core_web_lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]
# Only for the performance and token-cost measurements (`perf-run`).
perf = [
    "tiktoken==0.14.0",
    "psutil==7.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leakguard = ["data/*.txt", "data/*.gz", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import examples.demo

[tool.ruff]
line-length = 100
target-version = "py311"
