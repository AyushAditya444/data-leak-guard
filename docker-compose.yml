services:
  # Free fake LLM for demos and testing. Replace by pointing the guard elsewhere.
  mock-llm:
    build: .
    command: ["uvicorn", "--factory", "leakguard.mock_llm:create_mock_app",
              "--host", "0.0.0.0", "--port", "9000"]

  guard:
    build: .
    ports:
      # Localhost only. A bare "8080:8080" would listen on every network interface, so
      # anyone on the same network could use the guard. To expose it on purpose, change
      # this AND set LEAKGUARD_API_KEY (see the README's security section).
      - "127.0.0.1:8080:8080"
    environment:
      # Override to use a real provider, e.g. Ollama on your machine:
      #   LEAKGUARD_UPSTREAM_BASE_URL=http://host.docker.internal:11434/v1 docker compose up
      LEAKGUARD_UPSTREAM_BASE_URL: ${LEAKGUARD_UPSTREAM_BASE_URL:-http://mock-llm:9000/v1}
      # Optional guard key: `LEAKGUARD_API_KEY=... docker compose up`. Empty = off.
      LEAKGUARD_API_KEY: ${LEAKGUARD_API_KEY:-}
    depends_on:
      - mock-llm
