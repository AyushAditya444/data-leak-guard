services:
  # Free fake LLM for demos and testing. Replace by pointing the guard elsewhere.
  mock-llm:
    build: .
    command: ["uvicorn", "--factory", "leakguard.mock_llm:create_mock_app",
              "--host", "0.0.0.0", "--port", "9000"]

  guard:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Override to use a real provider, e.g. Ollama on your machine:
      #   LEAKGUARD_UPSTREAM_BASE_URL=http://host.docker.internal:11434/v1 docker compose up
      LEAKGUARD_UPSTREAM_BASE_URL: ${LEAKGUARD_UPSTREAM_BASE_URL:-http://mock-llm:9000/v1}
    depends_on:
      - mock-llm
